name: test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker compose run --rm devcontainer python3 -m unittest tests/test_client.py

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: "3.12"
          architecture: x64
      - run: pip install -e ./
