services:
  devcontainer:
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGCONNECT_TIMEOUT: "5"
    build:
      context: .
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:14-bookworm
    environment:
      # Disposable development DB only; no credentials or published ports.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
